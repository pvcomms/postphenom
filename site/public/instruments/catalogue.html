  // ---- the pen, laid over an element (niwa components/Sketch.tsx) ----
  let maskN = 0;
  function sketch(
    host,
    { kind = "box", seed, color = "var(--pen)", width, draw = false },
  ) {
    const pen =
      width ?? { box: 1.7, ring: 1.6, underline: 1.5, strike: 1.5 }[kind];
    const svg = el("svg", { class: "sketch", "aria-hidden": "true" });
    const ink = el("path", { fill: color });
    let mask = null;
    let mpath = null;
    if (draw && !REDUCE) {
      const id = `sk${++maskN}`;
      const defs = el("defs");
      mask = el("mask", { id, maskUnits: "userSpaceOnUse" });
      mpath = el("path", {
        class: "draw",
        pathLength: 1,
        fill: "none",
        "stroke-width": pen * 2 + 4,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
      });
      mask.append(mpath);
      defs.append(mask);
      svg.append(defs);
      ink.setAttribute("mask", `url(#${id})`);
    }
    svg.append(ink);
    host.append(svg);
    const paint = () => {
      const w = host.offsetWidth;
      const h = host.offsetHeight;
      if (!w || !h) return;
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      const s = seedOf(seed);
      const line =
        kind === "box"
          ? roughRect(w, h, s)
          : kind === "ring"
            ? roughEllipse(w, h, s, { pad: 3, grow: 1.18 })
            : kind === "underline"
              ? roughUnderline(w, s, { y: h - 0.5 })
              : roughStrike(w, h, s);
      ink.setAttribute("d", ribbon(line, pen, s));
      if (mpath) {
        mpath.setAttribute("d", line);
        mask.setAttribute("x", -40);
        mask.setAttribute("y", -40);
        mask.setAttribute("width", w + 80);
        mask.setAttribute("height", h + 80);
      }
    };
    const ro = new ResizeObserver(paint);
    ro.observe(host);
    paint();
    return () => {
      ro.disconnect();
      svg.remove();
    };
  }
  /** Sketches that belong to one render, taken away before the next. */
  const inked = { table: [], controls: [], page: [] };
  const clear = (k) => {
    for (const off of inked[k]) off();
    inked[k] = [];
  };

  /** The left edge of the sheet: one long drawn line, slowly drifting, like paper laid down. */
  function sheetEdge(host, seed) {
    const h = Math.max(window.innerHeight, 400);
    const r = rand(seedOf(seed));
    const pts = [];
    for (let y = -2; y <= h + 2; y += 90) pts.push([2.5 + spread(r, 1.2), y]);
    pts.push([2.5 + spread(r, 1.2), h + 2]);
    const line = smooth(pts);
    const wrap = document.createElement("div");
    wrap.className = "edge";
    wrap.setAttribute("aria-hidden", "true");
    const svg = el("svg", { viewBox: `0 0 8 ${h}` });
    svg.append(
      el("path", { d: ribbon(line, 1.8, seedOf(seed)), fill: "var(--pen)" }),
    );
    wrap.append(svg);
    host.prepend(wrap);
  }

  // ---- what is kept: one key, this browser only ----
  function load() {
    try {
      return JSON.parse(localStorage.getItem(KEY) || "null") || {};
    } catch {
      return {};
    }
  }
  function keep(own) {
    try {
      if (own) localStorage.setItem(KEY, JSON.stringify({ own }));
      else localStorage.removeItem(KEY);
      return true;
    } catch {
      /* storage refused or full: the page still works, it just forgets on reload */
      return false;
    }
  }

  // ---- the view's state lives in the address, as in niwa: ?q ?group ?sort ?dir ?beds ?id ----
  const params = () => new URLSearchParams(location.search);
  function setParams(patch, push = false) {
    const next = params();
    for (const [k, v] of Object.entries(patch)) {
      if (v === null || v === "") next.delete(k);
      else next.set(k, v);
    }
    const url = `${location.pathname}${next.size ? `?${next}` : ""}`;
    try {
      if (push) history.pushState(null, "", url);
      else history.replaceState(null, "", url);
    } catch {
      /* an address that cannot be rewritten: the view still follows S */
    }
    S.view = readView(next);
    render();
  }
  function readView(p) {
    return {
      q: p.get("q") ?? "",
      group: ["bed", "section", "stage", "none"].includes(p.get("group"))
        ? p.get("group")
        : "bed",
      sort: ["place", "title", "tended", "threads"].includes(p.get("sort"))
        ? p.get("sort")
        : "place",
      desc: p.get("dir") === "desc",
      beds: new Set((p.get("beds") ?? "").split(",").filter(Boolean)),
      id: p.get("id"),
    };
  }

  const GROUP_BY = [
    ["bed", "Bed"],
    ["section", "Section"],
    ["stage", "Stage"],
    ["none", "None"],
  ];
  const SORT_BY = [
    ["place", "Place"],
    ["title", "Title"],
    ["tended", "Tended"],
    ["threads", "Threads"],
  ];
  const STAGES = ["fresh", "tended", "settled", "fallow", "unknown"];
  /** Words too common to narrow anything: "theory of mind" should mean theory + mind. */
  const FILLER = new Set(
    "a an and as at by for from in into is it of on or the to with".split(" "),
  );
  const termsOf = (q) => {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    const kept = words.filter((w) => !FILLER.has(w));
    return kept.length ? kept : words;
  };
  /** The region of the whole a note belongs to, for grouping. */
  const sectionOf = (n, crumbs) =>
    crumbs.length >= 2 && crumbs[0].id
      ? crumbs[1].label
      : crumbs.length === 1 && crumbs[0].id
        ? n.label
        : crumbs.map((c) => c.label).join(" / ") ||
          (KIND_LABEL[n.kind] ?? n.kind);

  /**
   * Written links and prose mentions have a direction worth reading; the rest are
   * symmetric, so they stay one list (niwa components/Reader.tsx).
   */
  const GROUPS = [
    { kind: "link", direction: "out", label: "Links to" },
    { kind: "link", direction: "in", label: "Linked from" },
    { kind: "twin", label: "Same document, filed elsewhere" },
    { kind: "mention", direction: "out", label: "Names in passing" },
    { kind: "mention", direction: "in", label: "Named in passing by" },
    { kind: "concept", label: "Shared vocabulary" },
    { kind: "build", label: "Code on disk" },
    { kind: "seed", label: "Unplanted" },
  ];

  // ---- state ----
  const S = {
    source: "specimen",
    name: "",
    at: null,
    count: 0,
    index: null,
    view: readView(params()),
    active: 0,
    keyed: false,
    flat: [],
    marks: new Map(),
    beds: [],
  };

  function setGarden(g, { source, name = "", at = null, count = 0 }) {
    S.source = source;
    S.name = name;
    S.at = at;
    S.count = count;
    const byId = new Map(g.nodes.map((n) => [n.id, n]));
    const threads = new Map();
    for (const l of g.links) {
      if (!threads.has(l.source)) threads.set(l.source, []);
      if (!threads.has(l.target)) threads.set(l.target, []);
      threads
        .get(l.source)
        .push({ id: l.target, kind: l.kind, direction: "out" });
      threads
        .get(l.target)
        .push({ id: l.source, kind: l.kind, direction: "in" });
    }
    const place = outline(g.nodes);
    const nodes = [...g.nodes].sort(
      (a, b) => place.get(a.id).index - place.get(b.id).index,
    );
    const trails = new Map(g.nodes.map((n) => [n.id, trail(n, byId)]));
    const kids = new Map();
    for (const n of g.nodes)
      if (n.parent) kids.set(n.parent, (kids.get(n.parent) ?? 0) + 1);
    const haystack = new Map(
      nodes.map((n) => [
        n.id,
        [
          n.label,
          n.description,
          (n.tags ?? []).join(" "),
          trails
            .get(n.id)
            .map((c) => c.label)
            .join(" "),
          n.body,
        ]
          .join("\n")
          .toLowerCase(),
      ]),
    );
    shownPage = null;
    controlsKey = "";
    S.index = {
      nodes,
      links: g.links.length,
      byId,
      threads,
      place,
      trails,
      kids,
      haystack,
      resolve: makeResolver(g.nodes),
    };
    renderSource();
    renderWhole();
    render();
  }

  const describe = (n) =>
    S.index.trails
      .get(n.id)
      .map((c) => c.label)
      .join(" › ") ||
    (KIND_LABEL[n.kind] ?? n.kind);

  // ---- the garden's source ----
  function renderSource() {
    const own = S.source === "own";
    const I = S.index;
    $("g-name").textContent = own
      ? `Your notes${S.name ? ` · ${S.name}` : ""}`
      : "Specimen garden";
    $("g-tag").textContent = own ? "this browser only" : "synthetic";
    $("g-count").textContent =
      `${plural(I.nodes.length, "stone")} · ${plural(I.links, "thread")}`;
    $("g-note").textContent = own
      ? `Read in this page from ${S.count} markdown files${S.at ? `, ${day(S.at)}` : ""}. Nothing was uploaded; it is kept in this browser until you put the specimen back.`
      : "A made-up reader's garden: notes on attention, walking and the feed, a glossary of their own, a Notion workspace imported in one afternoon, two small pieces of code. Open a folder of your own markdown notes and the same rules read it here. Nothing is uploaded.";
    $("restore").hidden = !own;
    $("lede").textContent =
      `${plural(I.nodes.length, "note")} and ${plural(I.links, "thread")}, from ${own ? "the folder you opened" : "the specimen's notes, terms, imported pages and code"}. Search reads every word. A page opens with the path down to it, the notes beside it, and the part of the garden it touches. No note is hidden for want of a place.`;
  }

  // ---- the field (niwa components/Field.tsx) ----
  // The whole garden as beds of marks, one mark per note. Filtering and opening a page only
  // change which marks are lit, so the part is always seen against everything it is part of.
  function field(host, nodes, { compact = false, caption = "" } = {}) {
    const cols = compact ? 18 : 24;
    const by = new Map();
    for (const n of nodes) {
      if (!by.has(n.kind)) by.set(n.kind, []);
      by.get(n.kind).push(n);
    }
    const beds = KIND_ORDER.filter((k) => by.has(k)).map((k) => ({
      kind: k,
      nodes: by.get(k),
    }));
    const marks = new Map();
    const fig = document.createElement("figure");
    fig.className = "field";
    const box = document.createElement("div");
    box.className = `beds${compact ? " compact" : ""}`;
    box.setAttribute("aria-hidden", "true");
    const heads = [];
    for (const b of beds) {
      const col = document.createElement("div");
      const head = document.createElement("div");
      head.className = "meta bed-head";
      head.innerHTML = `<span class="name">${esc(KIND_LABEL[b.kind] ?? b.kind)}</span><span class="n"></span>`;
      const grid = document.createElement("div");
      grid.className = "marks";
      grid.style.gridTemplateColumns = `repeat(${Math.min(b.nodes.length, cols)}, ${compact ? 5 : 6}px)`;
      for (const n of b.nodes) {
        const j = jitter(seedOf(n.id), 0.5, 16);
        const m = document.createElement("span");
        m.className = "field-mark";
        m.dataset.id = n.id;
        m.style.cssText = `--k:var(--kind-${n.kind});--dx:${j.dx.toFixed(2)}px;--dy:${j.dy.toFixed(2)}px;--tilt:${j.rot.toFixed(1)}deg`;
        marks.set(n.id, m);
        grid.append(m);
      }
      col.append(head, grid);
      box.append(col);
      heads.push({ head, nodes: b.nodes });
    }
    const cap = document.createElement("figcaption");
    cap.className = "hand";
    fig.append(box, cap);
    host.append(fig);
    let rest = caption;
    const say = (c) => {
      if (typeof c === "string") cap.textContent = c;
      else cap.replaceChildren(c);
    };
    say(rest);
    box.addEventListener("click", (e) => {
      const id = e.target.closest("[data-id]")?.dataset.id;
      if (id) openPage(id);
    });
    box.addEventListener("mouseover", (e) => {
      const id = e.target.closest("[data-id]")?.dataset.id;
      const n = id && S.index.byId.get(id);
      if (n) cap.innerHTML = `<b>${esc(n.label)}</b> · ${esc(describe(n))}`;
      else say(rest);
    });
    box.addEventListener("mouseleave", () => say(rest));
    return {
      tone(fn) {
        for (const { head, nodes: bed } of heads) {
          let lit = 0;
          for (const n of bed) {
            const t = fn(n);
            if (t !== "off") lit++;
            marks.get(n.id).dataset.tone = t;
          }
          head.classList.toggle("lit", lit > 0);
          head.querySelector(".n").textContent =
            `${lit && lit !== bed.length ? `${lit}/` : ""}${bed.length}`;
        }
      },
      caption(c) {
        rest = c;
        say(c);
      },
    };
  }

  let whole = null;
  function renderWhole() {
    $("whole").replaceChildren();
    whole = field($("whole"), S.index.nodes);
  }

  // ---- the view: filter, sort, group ----
  function compute() {
    const I = S.index;
    const v = S.view;
    const terms = termsOf(v.q);
    const inView = I.nodes.filter(
      (n) =>
        (!v.beds.size || v.beds.has(n.kind)) &&
        terms.every((t) => I.haystack.get(n.id).includes(t)),
    );
    const by = {
      place: (a, b) => I.place.get(a.id).index - I.place.get(b.id).index,
      title: (a, b) => a.label.localeCompare(b.label),
      tended: (a, b) => (b.modified ?? "").localeCompare(a.modified ?? ""),
      threads: (a, b) => b.degree - a.degree,
    }[v.sort];
    let rows = [...inView].sort(by);
    if (v.desc) rows = rows.reverse();

    const keyOf = (n) =>
      v.group === "bed"
        ? n.kind
        : v.group === "stage"
          ? n.stage
          : v.group === "section"
            ? sectionOf(n, I.trails.get(n.id))
            : "all";
    const labelOf = (k) =>
      v.group === "bed"
        ? (KIND_LABEL[k] ?? k)
        : v.group === "stage"
          ? (STAGE_LABEL[k] ?? k)
          : v.group === "none"
            ? "Everything"
            : k;
    const whole = new Map();
    for (const n of I.nodes)
      whole.set(keyOf(n), (whole.get(keyOf(n)) ?? 0) + 1);
    const grouped = new Map();
    for (const n of rows) {
      const k = keyOf(n);
      if (!grouped.has(k)) grouped.set(k, []);
      grouped.get(k).push(n);
    }
    const order =
      v.group === "bed"
        ? KIND_ORDER
        : v.group === "stage"
          ? STAGES
          : [...grouped.keys()];
    const groups = order
      .filter((k) => grouped.has(k))
      .map((k) => ({
        key: k,
        label: labelOf(k),
        rows: grouped.get(k),
        total: whole.get(k) ?? 0,
      }));
    return { inView, groups, flat: groups.flatMap((g) => g.rows) };
  }

  let lastShape = "";
  function render() {
    if (!S.index) return;
    const I = S.index;
    const v = S.view;
    const { inView, groups, flat } = compute();
    const shape = `${v.q}|${v.group}|${v.sort}|${v.desc}|${[...v.beds]}`;
    if (shape !== lastShape) {
      S.active = 0;
      lastShape = shape;
    }
    S.flat = flat;
    const ids = new Set(inView.map((n) => n.id));
    const total = I.nodes.length;
    if ($("q") !== document.activeElement && $("q").value !== v.q)
      $("q").value = v.q;

    whole.tone((n) => (ids.has(n.id) ? "on" : "off"));
    whole.caption(
      inView.length === total
        ? "One mark per note, bed by bed, in reading order. Hover to name one; click to open it."
        : `Lit: the ${plural(inView.length, "note")} in view. The rest of the garden stays drawn.`,
    );
    $("tally").textContent =
      inView.length === total
        ? `${total} notes`
        : `${inView.length} of ${total}`;

    renderControls();
    renderTable(groups, flat, total);
    renderPage();
  }

  let controlsKey = "";
  function renderControls() {
    const v = S.view;
    // Redrawn only when what they show changes, so a pen line is not drawn again per keystroke.
    const key = `${v.group}|${v.sort}|${[...v.beds]}|${S.index.nodes.length}`;
    if (key === controlsKey) return;
    controlsKey = key;
    clear("controls");
    const seg = (host, opts, value, name) => {
      host.innerHTML = opts
        .map(
          ([id, label]) =>
            `<button type="button" class="seg" data-${name}="${id}" aria-pressed="${id === value}"><span class="in">${label}</span></button>`,
        )
        .join("");
      const on = host.querySelector('[aria-pressed="true"] .in');
      if (on)
        inked.controls.push(
          sketch(on, {
            kind: "underline",
            seed: `${name}-${value}`,
            color: "var(--accent)",
            draw: true,
          }),
        );
    };
    seg($("group"), GROUP_BY, v.group, "group");
    seg($("sort"), SORT_BY, v.sort, "sort");

    const counts = new Map();
    for (const n of S.index.nodes)
      counts.set(n.kind, (counts.get(n.kind) ?? 0) + 1);
    $("beds").innerHTML =
      KIND_ORDER.filter((k) => counts.get(k))
        .map((k) => {
          const on = v.beds.has(k);
          return `<button type="button" class="bed-chip${on || !v.beds.size ? "" : " dim"}" data-bed="${k}" aria-pressed="${on}" style="--k:var(--kind-${k})"><span class="dot" aria-hidden="true"></span>${esc(KIND_LABEL[k] ?? k)}<span class="n">${counts.get(k)}</span></button>`;
        })
        .join("") +
      (v.beds.size
        ? `<button type="button" class="meta all-beds" data-bed="">all beds</button>`
        : "");
    for (const b of $("beds").querySelectorAll('[aria-pressed="true"]'))
      inked.controls.push(
        sketch(b, {
          kind: "ring",
          seed: `bed-${b.dataset.bed}`,
          color: `var(--kind-${b.dataset.bed})`,
          draw: true,
        }),
      );
  }

  function renderTable(groups, flat, total) {
    const I = S.index;
    const v = S.view;
    clear("table");
    if (!flat.length) {
      $("table").innerHTML =
        `<p class="empty-q">Nothing in the garden says “${esc(v.q.trim())}”${v.beds.size ? " in these beds" : ""}.</p>`;
      return;
    }
    const indented = v.sort === "place" && !v.desc;
    const q = v.q.trim();
    const head = [
      ["title", "Name", ""],
      [null, "Bed", "hide-md col-bed"],
      ["threads", "Out · In", "hide-sm col-thr"],
      ["tended", "Tended", "hide-md col-day"],
      [null, "Topics", "hide-xl col-top"],
    ]
      .map(([key, label, cls]) => {
        const sorted = key && key === v.sort;
        return `<th class="meta ${cls}"${sorted ? ` aria-sort="${v.desc ? "descending" : "ascending"}"` : ""}>${
          key
            ? `<button type="button" class="head-sort${sorted ? " on" : ""}" data-sort="${key}">${label}${sorted ? (v.desc ? " ↓" : " ↑") : ""}</button>`
            : label
        }</th>`;
      })
      .join("");
    let i = 0;
    const body = groups
      .map((g) => {
        const grp =
          v.group === "none"
            ? ""
            : `<tr class="grp"><th colspan="5" scope="rowgroup"><span class="gname">${esc(g.label)}</span><span class="meta">${
                g.rows.length === g.total
                  ? g.total
                  : `${g.rows.length} of ${g.total}`
              } · ${Math.max(1, Math.round((g.total / total) * 100))}% of the garden</span>
              <div class="share" aria-hidden="true"><span style="width:${((g.total / total) * 100).toFixed(2)}%"><span style="width:${((g.rows.length / g.total) * 100).toFixed(2)}%${v.group === "bed" ? `;--k:var(--kind-${g.key})` : ""}"></span></span></div></th></tr>`;
        const rows = g.rows.map((n) => row(n, i++, indented, q)).join("");
        return `<tbody>${grp}${rows}</tbody>`;
      })
      .join("");
    $("table").innerHTML =
      `<table class="db"><thead><tr>${head}</tr></thead>${body}</table>`;
    const open = v.id && I.byId.get(v.id);
    if (open) {
      const t = $("table").querySelector(
        `[data-row="${CSS.escape(open.id)}"] .ttl`,
      );
      if (t)
        inked.table.push(
          sketch(t, {
            kind: "underline",
            seed: open.id,
            color: "var(--accent)",
            draw: true,
          }),
        );
    }
  }

  function row(n, i, indented, q) {
    const I = S.index;
    const crumbs = I.trails.get(n.id);
    const threads = I.threads.get(n.id) ?? [];
    const out = threads.filter((t) => t.direction === "out").length;
    const inn = threads.length - out;
    const under = I.kids.get(n.id) ?? 0;
    const depth = indented ? I.place.get(n.id).depth : 0;
    const titleHit = q && n.label.toLowerCase().includes(q.toLowerCase());
    // The whole phrase if the note has it, otherwise the first word that counts.
    const hit =
      q && !titleHit
        ? (snippet(n.body, q) ?? snippet(n.body, termsOf(q)[0] ?? ""))
        : null;
    // A row is a note, not a title: its first breath sits under the name.
    const breath = hit ? "" : gist(n, 140);
    const active = S.keyed && i === S.active;
    const open = S.view.id === n.id;
    return `<tr class="db-row" data-row="${esc(n.id)}" data-i="${i}"${active ? " data-active" : ""}${open ? " data-open" : ""}>
      <td class="name"><div class="name-in" style="padding-left:${depth * 16}px">
        <span class="dot" aria-hidden="true" style="--k:var(--kind-${n.kind})"></span>
        <div class="name-text">
          <span class="ttl"><button type="button" class="row-title" data-open="${esc(n.id)}">${esc(n.label)}</button></span>${under ? `<span class="meta under">${under} under</span>` : ""}
          ${crumbs.length ? `<div class="crumbs">${esc(crumbs.map((c) => c.label).join(" › "))}</div>` : ""}
          ${hit ? `<div class="hit">${esc(hit.before)}<mark>${esc(hit.match)}</mark>${esc(hit.after)}</div>` : ""}
          ${breath ? `<div class="breath">${esc(breath)}</div>` : ""}
        </div></div></td>
      <td class="c hide-md">${esc(KIND_LABEL[n.kind] ?? n.kind)}</td>
      <td class="num hide-sm">${out}<i> · </i>${inn}</td>
      <td class="num hide-md" title="${esc(STAGE_LABEL[n.stage])}">${esc(day(n.modified))}</td>
      <td class="hide-xl"><div class="tags">${(n.tags ?? []).map((t) => `<span class="tag-pill">${esc(t)}</span>`).join("")}</div></td>
    </tr>`;
  }

  // ---- the markdown every note is written in (niwa components/Markdown.tsx) ----
  // Every character of the source is escaped; links out are only ever http(s) or mailto.
  const INLINE = new RegExp(
    [
      /\[\[([^\]\n|#]{1,120})(?:#[^\]|\n]*)?(?:\|([^\]\n]+))?\]\]/.source, // 1 ref, 2 alias
      /!\[([^\]\n]*)\]\(([^)\s]+)\)/.source, // 3 alt, 4 src
      /\[([^\]\n]+)\]\(([^)\s]+)\)/.source, // 5 text, 6 href
      /\*\*([^*\n]+)\*\*/.source, // 7 bold
      /(?<![\w*])\*([^*\s][^*\n]*?)\*(?![\w*])/.source, // 8 italic
      /(?<![\w])_([^_\n]+)_(?![\w])/.source, // 9 italic
      /~~([^~\n]+)~~/.source, // 10 struck
      /`([^`\n]+)`/.source, // 11 code
      /(https?:\/\/[^\s<>()[\]]+[^\s<>()[\].,;:!?'"])/.source, // 12 bare url
      /\\([\\`*_{}[\]()#+\-.!~|<>&])/.source, // 13 escaped punctuation
    ].join("|"),
    "g",
  );
  const external = (href) => /^(https?:|mailto:)/i.test(href);

  function inline(text, ctx) {
    let out = "";
    const re = new RegExp(INLINE.source, "g");
    let last = 0;
    let m;
    while ((m = re.exec(text))) {
      if (m.index > last) out += esc(text.slice(last, m.index));
      if (m[1]) {
        const target = ctx.wiki(m[1].trim());
        const label = m[2]?.trim() || target?.label || m[1].trim();
        out += target
          ? `<button type="button" class="wiki" data-open="${esc(target.id)}" title="${esc(target.description || target.label)}">${esc(label)}</button>`
          : `<span class="unwritten">${esc(label)}</span>`;
      } else if (m[4] !== undefined) {
        out += esc(m[3] || m[4]);
      } else if (m[5] !== undefined) {
        out += external(m[6])
          ? `<a href="${esc(m[6])}" target="_blank" rel="noreferrer noopener">${inline(m[5], ctx)}</a>`
          : inline(m[5], ctx);
      } else if (m[7] !== undefined)
        out += `<strong>${inline(m[7], ctx)}</strong>`;
      else if (m[8] !== undefined || m[9] !== undefined)
        out += `<em>${inline(m[8] ?? m[9], ctx)}</em>`;
      else if (m[10] !== undefined) out += `<s>${inline(m[10], ctx)}</s>`;
      else if (m[11] !== undefined) out += `<code>${esc(m[11])}</code>`;
      else if (m[12] !== undefined)
        out += `<a href="${esc(m[12])}" target="_blank" rel="noreferrer noopener">${esc(m[12].replace(/^https?:\/\/(www\.)?/, ""))}</a>`;
      else if (m[13] !== undefined) out += esc(m[13]);
      last = m.index + m[0].length;
    }
    if (last < text.length) out += esc(text.slice(last));
    return out;
  }

  const LIST = /^(\s*)([-*+]|\d+[.)])\s+(?:\[([ xX])\]\s+)?(.*)$/;
  const HEADING = /^(#{1,6})\s+(.*)$/;
  const RULE = /^([-*_])(\s*\1){2,}$/;
  const IMAGE = /^!\[([^\]]*)\]\(([^)\s]+)\)$/;
  const startsBlock = (line) => {
    const t = line.trim();
    return (
      HEADING.test(t) ||
      t.startsWith("```") ||
      t.startsWith(">") ||
      t.startsWith("|") ||
      LIST.test(line) ||
      RULE.test(t) ||
      IMAGE.test(t)
    );
  };

  /** Line-based, because an export is not paragraph-shaped: lists nest by indentation. */
  function parse(body) {
    const lines = body.replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const t = line.trim();
      if (!t) {
        i++;
        continue;
      }
      if (t.startsWith("```")) {
        const buf = [];
        i++;
        while (i < lines.length && !lines[i].trim().startsWith("```"))
          buf.push(lines[i++]);
        i++;
        out.push({ t: "code", text: buf.join("\n") });
        continue;
      }
      const h = t.match(HEADING);
      if (h) {
        out.push({ t: "h", level: h[1].length, text: h[2] });
        i++;
        continue;
      }
      if (RULE.test(t)) {
        out.push({ t: "hr" });
        i++;
        continue;
      }
      const img = t.match(IMAGE);
      if (img) {
        out.push({ t: "img", alt: img[1], src: img[2] });
        i++;
        continue;
      }
      if (t.startsWith("|")) {
        const buf = [];
        while (i < lines.length && lines[i].trim().startsWith("|"))
          buf.push(lines[i++].trim());
        const rows = buf
          .map((l) =>
            l
              .replace(/^\||\|$/g, "")
              .split("|")
              .map((c) => c.trim()),
          )
          .filter((cells) => !cells.every((c) => /^:?-{2,}:?$/.test(c)));
        out.push(
          rows.length >= 2 ? { t: "table", rows } : { t: "p", lines: buf },
        );
        continue;
      }
      if (t.startsWith(">")) {
        const buf = [];
        while (i < lines.length && lines[i].trim().startsWith(">"))
          buf.push(lines[i++].trim().replace(/^>\s?/, ""));
        out.push({ t: "quote", lines: buf });
        continue;
      }
      if (LIST.test(line)) {
        const items = [];
        const indents = [];
        const depthOf = (n) => {
          while (indents.length && indents.at(-1) > n) indents.pop();
          if (!indents.length || indents.at(-1) < n) indents.push(n);
          return indents.length - 1;
        };
        while (i < lines.length) {
          const l = lines[i];
          const m = l.match(LIST);
          if (m) {
            items.push({
              depth: depthOf(m[1].replace(/\t/g, "    ").length),
              marker: /\d/.test(m[2]) ? m[2].replace(")", ".") : null,
              check: m[3] === undefined ? null : m[3] !== " ",
              text: m[4],
            });
            i++;
            continue;
          }
          // A blank line between two items does not end the list.
          if (!l.trim() && i + 1 < lines.length && LIST.test(lines[i + 1])) {
            i++;
            continue;
          }
          // An indented line under an item is that item's continuation.
          if (l.trim() && /^\s{2,}/.test(l) && !startsBlock(l)) {
            items[items.length - 1].text += `\n${l.trim()}`;
            i++;
            continue;
          }
          break;
        }
        out.push({ t: "list", items });
        continue;
      }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !startsBlock(lines[i]))
        buf.push(lines[i++].trim());
      if (!buf.length) buf.push(lines[i++].trim());
      out.push({ t: "p", lines: buf });
    }
    return out;
  }

  const withBreaks = (lines, ctx) =>
    lines.map((l) => inline(l, ctx)).join("<br />");

  function markdown(body, ctx) {
    return parse(body)
      .map((b) => {
        switch (b.t) {
          case "h":
            return b.level <= 2
              ? `<h3>${inline(b.text, ctx)}</h3>`
              : `<h4>${inline(b.text, ctx)}</h4>`;
          case "hr":
            return "<hr />";
          case "img":
            return `<p>${esc(b.alt || b.src)}</p>`;
          case "code":
            return `<pre>${esc(b.text)}</pre>`;
          case "quote":
            return `<blockquote>${withBreaks(
              b.lines.filter((l, li, all) => l || all[li - 1]),
              ctx,
            )}</blockquote>`;
          case "list":
            return `<ul>${b.items
              .map(
                (it) =>
                  `<li class="${it.marker || it.check !== null ? "plain" : ""}" style="margin-left:${it.depth * 1.15}em">${
                    it.marker
                      ? `<span class="md-marker" aria-hidden="true">${esc(it.marker)}</span>`
                      : ""
                  }${
                    it.check !== null
                      ? `<span class="md-check"${it.check ? " data-done" : ""} role="img" aria-label="${it.check ? "done" : "not done"}"></span>`
                      : ""
                  }${withBreaks(it.text.split("\n"), ctx)}</li>`,
              )
              .join("")}</ul>`;
          case "table": {
            const [head, ...rest] = b.rows;
            return `<div class="tbl"><table><thead><tr>${head
              .map((c) => `<th>${inline(c, ctx)}</th>`)
              .join("")}</tr></thead><tbody>${rest
              .map(
                (cells) =>
                  `<tr>${cells.map((c) => `<td>${inline(c, ctx)}</td>`).join("")}</tr>`,
              )
              .join("")}</tbody></table></div>`;
          }
          default:
            return `<p>${withBreaks(b.lines, ctx)}</p>`;
        }
      })
      .join("");
  }

  // ---- a page: a catalogue row opened (niwa components/Page.tsx) ----
  // Before its own words it says where it is: the path down to it, where it sits among its
  // siblings, and which part of the whole its threads reach, so nothing is ever read as if
  // it stood alone.
  let shownPage = null;
  function renderPage() {
    const I = S.index;
    const node = S.view.id ? I.byId.get(S.view.id) : null;
    document.body.classList.toggle("paged", !!node);
    if (!node) {
      if (shownPage) {
        clear("page");
        $("page").hidden = true;
        $("page").replaceChildren();
        shownPage = null;
      }
      return;
    }
    if (shownPage === node.id) return;
    const first = !shownPage;
    shownPage = node.id;
    clear("page");
    const crumbs = I.trails.get(node.id) ?? [];
    const threads = I.threads.get(node.id) ?? [];
    const near = new Set(threads.map((t) => t.id));
    const parent = node.parent ? (I.byId.get(node.parent) ?? null) : null;
    const siblings = parent ? childrenOf(parent, I.nodes) : [];
    const children = I.kids.get(node.id) ? childrenOf(node, I.nodes) : [];
    const kin = new Set([
      ...(parent ? [parent.id] : []),
      ...siblings.map((s) => s.id),
      ...children.map((c) => c.id),
    ]);
    const bed = KIND_LABEL[node.kind] ?? node.kind;
    const bedSize = I.nodes.filter((n) => n.kind === node.kind).length;
    const depth = I.place.get(node.id)?.depth ?? 0;
    const bedsReached = new Set(
      [...near].map((id) => I.byId.get(id)?.kind).filter(Boolean),
    ).size;
    const out = threads.filter((t) => t.direction === "out").length;
    const groups = GROUPS.map((g) => {
      const seen = new Set();
      const items = threads
        .filter(
          (t) =>
            t.kind === g.kind && (!g.direction || t.direction === g.direction),
        )
        .map((t) => I.byId.get(t.id))
        .filter((n) => {
          if (!n || seen.has(n.id)) return false;
          seen.add(n.id);
          return true;
        });
      return { ...g, items };
    }).filter((g) => g.items.length);
    const whereSentence = [
      `One of ${bedSize} in ${bed}`,
      depth > 0 && crumbs[0]
        ? `${plural(depth, "level")} below ${crumbs[0].label}`
        : null,
      threads.length
        ? `${plural(threads.length, "thread")} reaching ${plural(near.size, "note")} in ${plural(bedsReached, "bed")}`
        : "no threads yet — nothing links here, and it links nowhere",
    ]
      .filter(Boolean)
      .join(" · ");
    const family = (title, meta, nodes) =>
      `<div class="family"><div class="meta">${esc(title)}<span style="opacity:.6"> · ${esc(meta)}</span></div><ol>${nodes
        .map((n) => {
          const here = n.id === node.id;
          return `<li><button type="button" class="family-item" data-open="${esc(n.id)}"${here ? ' disabled aria-current="page"' : ""}><span class="dot" aria-hidden="true" style="--k:var(--kind-${n.kind})"></span><span>${esc(n.label)}</span></button></li>`;
        })
        .join("")}</ol></div>`;
    const long = new Date(node.modified ?? 0).toLocaleDateString("en-GB", {
      day: "numeric",
      month: "long",
      year: "numeric",
    });
    const ctx = { wiki: (ref) => I.resolve(ref, node) };
    const file = node.file
      ? S.source === "own" && node.source !== "code"
        ? `${S.name || "your folder"}/${node.file}`
        : node.file
      : "";

    const page = $("page");
    page.hidden = false;
    page.setAttribute("aria-label", `Page: ${node.label}`);
    if (first) page.style.animation = "";
    else page.style.animation = "none";
    page.innerHTML = `<div class="page-top">
        <nav class="trail" aria-label="Where this sits">${crumbs
          .map(
            (c, i) =>
              `${i ? '<span class="sep">›</span>' : ""}${
                c.id
                  ? `<button type="button" class="crumb" data-open="${esc(c.id)}">${esc(c.label)}</button>`
                  : `<span>${esc(c.label)}</span>`
              }`,
          )
          .join("")}</nav>
        <button type="button" class="chip" id="close" aria-label="Close">esc</button>
      </div>
      <article>
        <h2>${esc(node.label)}</h2>
        ${node.description && node.kind !== "notion" ? `<p class="desc">${esc(node.description)}</p>` : ""}
        <dl class="props">
          <dt>Bed</dt><dd><span class="dot" aria-hidden="true" style="--k:var(--kind-${node.kind})"></span>${esc(bed)}</dd>
          <dt>Tended</dt><dd>${node.modified ? esc(long) : "—"}<span class="soft">· ${esc(STAGE_LABEL[node.stage] ?? node.stage)}</span></dd>
          ${(node.tags ?? []).length ? `<dt>Topics</dt><dd>${node.tags.map((t) => `<span class="tag-pill">${esc(t)}</span>`).join("")}</dd>` : ""}
          <dt>Threads</dt><dd>${out} out · ${threads.length - out} in</dd>
        </dl>
        <section class="context" aria-label="In the whole">
          <div class="meta">In the whole</div>
          <p class="hand where">${esc(whereSentence)}.</p>
          <div id="part"></div>
          ${parent ? family(`Beside it, under ${parent.label}`, `${siblings.findIndex((s) => s.id === node.id) + 1} of ${siblings.length}`, siblings) : ""}
          ${children.length ? family("Under this page", `${children.length}`, children) : ""}
        </section>
        <div class="body-sep">${
          node.body
            ? `<div class="reader-body">${markdown(node.body, ctx)}</div>`
            : `<p class="hand nothing">${
                node.kind === "notion"
                  ? "Only ever a title in Notion. It is kept because its parent lists it."
                  : node.kind === "ghost"
                    ? "Linked to and never written."
                    : "Nothing written here yet."
              }</p>`
        }</div>
        ${
          groups.length
            ? `<div class="threads-out">${groups
                .map(
                  (g) =>
                    `<div class="meta">${esc(g.label)}<i> · ${g.items.length}</i></div><div class="nbrs">${g.items
                      .map(
                        (n) =>
                          `<button type="button" class="nbr" data-open="${esc(n.id)}" title="${esc(describe(n) || n.label)}"><span class="dot" aria-hidden="true" style="--k:var(--kind-${n.kind})"></span>${esc(n.label.length > 44 ? `${n.label.slice(0, 44)}…` : n.label)}</button>`,
                      )
                      .join("")}</div>`,
                )
                .join("")}</div>`
            : ""
        }
        ${file ? `<p class="filepath">${esc(file)}</p>` : ""}
      </article>`;
    sheetEdge(page, node.id);
    const keyCaption = document.createElement("span");
    keyCaption.className = "keys";
    keyCaption.innerHTML = `<span><i class="self"></i>this note</span><span><i></i>one thread away</span>${kin.size ? '<span><i class="kin"></i>same parent</span>' : ""}`;
    const part = field(page.querySelector("#part"), I.nodes, {
      compact: true,
      caption: keyCaption,
    });
    part.tone((n) =>
      n.id === node.id
        ? "self"
        : near.has(n.id)
          ? "near"
          : kin.has(n.id)
            ? "kin"
            : "off",
    );
    page.scrollTo({ top: 0 });
    // Keep the open page's row in sight: the part stays next to its place in the list.
    $("table")
      .querySelector(`[data-row="${CSS.escape(node.id)}"]`)
      ?.scrollIntoView({
        block: "nearest",
        behavior: REDUCE ? "auto" : "smooth",
      });
  }

  function openPage(id) {
    if (!S.index.byId.has(id)) return;
    const i = S.flat.findIndex((n) => n.id === id);
    if (i >= 0) S.active = i;
    setParams({ id }, S.view.id !== id);
  }
  function closePage() {
    setParams({ id: null });
  }

  // ---- wiring ----
  let qTimer = 0;
  $("q").addEventListener("input", (e) => {
    const value = e.target.value;
    clearTimeout(qTimer);
    S.view.q = value;
    render();
    qTimer = setTimeout(() => {
      const next = params();
      if (value.trim()) next.set("q", value.trim());
      else next.delete("q");
      try {
        history.replaceState(
          null,
          "",
          `${location.pathname}${next.size ? `?${next}` : ""}`,
        );
      } catch {
        /* the address stays; the view does not depend on it */
      }
    }, 250);
  });
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, [data-row]");
    if (!t) return;
    if (t.id === "close") return closePage();
    if (t.dataset.open) return openPage(t.dataset.open);
    if (t.dataset.group)
      return setParams({
        group: t.dataset.group === "bed" ? null : t.dataset.group,
      });
    if (t.dataset.sort) {
      const s = t.dataset.sort;
      return setParams(
        s === S.view.sort
          ? { dir: S.view.desc ? null : "desc" }
          : { sort: s === "place" ? null : s, dir: null },
      );
    }
    if (t.dataset.bed !== undefined) {
      if (!t.dataset.bed) return setParams({ beds: null });
      const next = new Set(S.view.beds);
      if (next.has(t.dataset.bed)) next.delete(t.dataset.bed);
      else next.add(t.dataset.bed);
      return setParams({ beds: [...next].join(",") });
    }
    if (t.dataset.row) {
      S.active = +t.dataset.i;
      return openPage(t.dataset.row);
    }
  });
  window.addEventListener("popstate", () => {
    S.view = readView(params());
    render();
  });

  function moveActive(step) {
    S.keyed = true;
    S.active = Math.max(0, Math.min(S.flat.length - 1, S.active + step));
    for (const r of $("table").querySelectorAll("[data-active]"))
      r.removeAttribute("data-active");
    const r = $("table").querySelector(`[data-i="${S.active}"]`);
    if (r) {
      r.setAttribute("data-active", "");
      r.scrollIntoView({ block: "nearest" });
    }
  }
  window.addEventListener("keydown", (e) => {
    const q = $("q");
    const a = document.activeElement;
    const typing = a instanceof HTMLInputElement && a !== q;
    if (typing) return;
    if (
      (e.key === "k" && (e.metaKey || e.ctrlKey)) ||
      (e.key === "/" && a !== q)
    ) {
      e.preventDefault();
      q.focus();
      q.select();
    } else if (e.key === "Escape") {
      if (S.view.id) closePage();
      else if (S.view.q) {
        q.value = "";
        setParams({ q: null });
      } else q.blur();
    } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (a && a.closest && a.closest("#page")) return;
      e.preventDefault();
      moveActive(e.key === "ArrowDown" ? 1 : -1);
    } else if (e.key === "Enter" && (S.keyed || a === q) && S.flat[S.active]) {
      if (a !== q && a instanceof HTMLButtonElement) return;
      e.preventDefault();
      openPage(S.flat[S.active].id);
    }
  });

  // ---- your own folder: read here, never sent ----
  function openFiles(files, { name, at, count }) {
    const g = buildGarden(files, { now: Date.now() });
    setGarden(g, { source: "own", name, at, count });
    return g;
  }
  $("open").addEventListener("click", () => $("folder").click());
  $("folder").addEventListener("change", async (e) => {
    const input = e.target;
    const list = [...input.files];
    input.value = "";
    if (!list.length) return;
    const status = $("g-status");
    $("open").disabled = true;
    status.textContent = "Reading the folder…";
    try {
      const { name, files } = await readFolder(list);
      if (!files.length) {
        status.textContent =
          "No markdown notes in that folder. Nothing was read.";
        return;
      }
      await new Promise((r) => setTimeout(r, 30));
      const at = new Date().toISOString();
      const g = openFiles(files, { name, at, count: files.length });
      setParams({ id: null });
      const kept = keep({
        name,
        at,
        files: files.map((f) => [f.path, f.mtime, f.text]),
      });
      status.textContent =
        `Read ${plural(files.length, "note")}: ${plural(g.nodes.length, "stone")}, ${plural(g.links.length, "thread")}.` +
        (kept
          ? ""
          : " Too many to keep in this browser; open the folder again after a reload.");
    } catch {
      status.textContent =
        "That folder could not be read here. Nothing was kept.";
    } finally {
      $("open").disabled = false;
    }
  });
  $("restore").addEventListener("click", () => {
    keep(null);
    const now = Date.now();
    setGarden(
      buildGarden(specimenFiles(now), { repos: specimenRepos(now), now }),
      {
        source: "specimen",
      },
    );
    setParams({ id: null });
    $("g-status").textContent =
      "Your notes are forgotten here. This is the specimen again.";
  });

  // ---- open ----
  sketch($("whole-word"), {
    kind: "ring",
    seed: "the-whole",
    color: "var(--accent)",
    draw: true,
  });
  {
    const own = load().own;
    let opened = false;
    if (own?.files?.length) {
      try {
        openFiles(
          own.files.map(([path, mtime, text]) => ({ path, mtime, text })),
          { name: own.name, at: own.at, count: own.files.length },
        );
        opened = true;
      } catch {
        opened = false;
      }
    }
    if (!opened) {
      const now = Date.now();
      setGarden(
        buildGarden(specimenFiles(now), { repos: specimenRepos(now), now }),
        {
          source: "specimen",
        },
      );
    }
  }
</script>
